<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akshay Thalinja | Senior Software Engineer</title>
    <meta name="description" content="Akshay Thalinja — Senior Software Engineer at Akaike Technologies.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Syne:wght@800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --accent: #ff3e00;
            --text-main: #ffffff;
            --text-dim: #888888;
            --card-bg: #141414;
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Abstract Background Decor */
        body::before {
            content: "";
            position: fixed;
            top: -10%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 62, 0, 0.15) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            filter: blur(60px);
        }

        main {
            flex: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 80px 24px;
            width: 100%;
        }

        header {
            margin-bottom: 80px;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            line-height: 0.9;
            margin-bottom: 16px;
            letter-spacing: -2px;
            text-transform: uppercase;
        }

        .role {
            font-size: 1.2rem;
            color: var(--text-dim);
            font-weight: 300;
            letter-spacing: 1px;
        }

        .role span {
            color: var(--accent);
            font-weight: 500;
        }

        nav {
            margin-top: 40px;
            display: flex;
            gap: 24px;
        }

        nav a {
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding-bottom: 4px;
            border-bottom: 1px solid transparent;
            transition: var(--transition);
        }

        nav a:hover {
            color: var(--accent);
            border-bottom: 1px solid var(--accent);
        }

        .section-label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--accent);
            margin-bottom: 32px;
            font-weight: 700;
        }

        #blog-feed {
            display: grid;
            gap: 20px;
        }

        .post-card {
            background: var(--card-bg);
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            transition: var(--transition);
            border-left: 0px solid var(--accent);
        }

        .post-card:hover {
            background: #1a1a1a;
            transform: translateX(10px);
            border-left: 4px solid var(--accent);
        }

        .post-info h3 {
            color: var(--text-main);
            font-size: 1.25rem;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .post-date {
            color: var(--text-dim);
            font-size: 0.85rem;
        }

        .loading, .error-msg {
            padding: 40px;
            color: var(--text-dim);
            text-align: center;
            background: var(--card-bg);
        }

        .error-msg a {
            color: var(--accent);
            text-decoration: none;
        }

        footer {
            padding: 40px 24px;
            text-align: center;
            border-top: 1px solid #1a1a1a;
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        @media (max-width: 600px) {
            .post-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            main { padding: 40px 20px; }
            h1 { margin-bottom: 24px; }
            nav { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

<div id="mandatory-bot-banner" style="background-color: #0b0f19; color: #e2e8f0; text-align: center; padding: 12px 40px 12px 16px; font-size: 14px; font-family: system-ui, -apple-system, sans-serif; position: relative; width: 100%; box-sizing: border-box; z-index: 10000; border-bottom: 1px solid #1e293b; display: flex; justify-content: center; align-items: center; min-height: 48px; line-height: 1.5;">
    <span style="max-width: 800px; margin: 0 auto;">
        The design and code of this website are automatically generated and updated weekly by an LLM. 
        <a href="/prompt.txt" style="color: #38bdf8; text-decoration: none; font-weight: 500; white-space: nowrap; margin-left: 4px;">Read the prompt &rarr;</a>
    </span>
    <button onclick="document.getElementById('mandatory-bot-banner').remove()" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: #1e293b; border: 1px solid #334155; border-radius: 4px; color: #94a3b8; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;" onmouseover="this.style.color='#fff';this.style.backgroundColor='#334155';" onmouseout="this.style.color='#94a3b8';this.style.backgroundColor='#1e293b';">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
</div>


    <main>
        <header>
            <h1>Akshay<br>Thalinja</h1>
            <p class="role">Senior Software Engineer at <span>Akaike</span></p>
            
            <nav>
                <a href="https://github.com/akstspace" target="_blank">GitHub</a>
                <a href="https://in.linkedin.com/in/akshay-t-b18b13172" target="_blank">LinkedIn</a>
                <a href="https://chaioverflow.substack.com" target="_blank">Blog</a>
            </nav>
        </header>

        <section>
            <span class="section-label">Latest Writing</span>
            <div id="blog-feed">
                <div class="loading">Fetching latest posts...</div>
            </div>
        </section>
    </main>

    <footer>
        chaioverflow &copy; <span id="year"></span>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        async function fetchPosts() {
            const feedContainer = document.getElementById('blog-feed');
            const rssUrl = 'https://api.rss2json.com/v1/api.json?rss_url=https://chaioverflow.substack.com/feed';

            try {
                const response = await fetch(rssUrl);
                if (!response.ok) throw new Error('Network error');
                
                const data = await response.json();
                
                if (data.status === 'ok') {
                    feedContainer.innerHTML = '';
                    // Get only first 3 items
                    const posts = data.items.slice(0, 3);
                    
                    posts.forEach(post => {
                        const date = new Date(post.pubDate).toLocaleDateString('en-US', {
                            month: 'short',
                            day: 'numeric',
                            year: 'numeric'
                        });

                        const postElement = document.createElement('a');
                        postElement.href = post.link;
                        postElement.target = '_blank';
                        postElement.className = 'post-card';
                        postElement.innerHTML = `
                            <div class="post-info">
                                <h3>${post.title}</h3>
                                <div class="post-date">${date}</div>
                            </div>
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent)"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
                        `;
                        feedContainer.appendChild(postElement);
                    });
                } else {
                    throw new Error('API status not ok');
                }
            } catch (error) {
                feedContainer.innerHTML = `
                    <div class="error-msg">
                        Unable to load posts. <br>
                        Visit <a href="https://chaioverflow.substack.com" target="_blank">chaioverflow.substack.com</a> to read.
                    </div>
                `;
            }
        }

        fetchPosts();
    </script>
</body>
</html>
