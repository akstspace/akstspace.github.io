<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akshay Thalinja | Senior Software Engineer</title>
    <meta name="description" content="Akshay Thalinja — Senior Software Engineer at Akaike Technologies.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Syne:wght@800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0c;
            --accent: #ff3e00;
            --text-main: #f4f4f4;
            --text-dim: #888;
            --surface: #16161a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Abstract Background Decor */
        body::before {
            content: "";
            position: fixed;
            top: -10%;
            right: -10%;
            width: 40vw;
            height: 40vw;
            background: radial-gradient(circle, rgba(255, 62, 0, 0.1) 0%, rgba(10, 10, 12, 0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        main {
            flex: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 80px 24px;
            width: 100%;
        }

        header {
            margin-bottom: 80px;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            line-height: 0.9;
            text-transform: uppercase;
            margin-bottom: 16px;
            letter-spacing: -2px;
        }

        .role {
            font-size: 1.2rem;
            color: var(--text-dim);
            font-weight: 300;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .role::before {
            content: "";
            width: 40px;
            height: 1px;
            background: var(--accent);
            display: inline-block;
        }

        .nav-links {
            margin-top: 40px;
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 8px 0;
            border-bottom: 1px solid transparent;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        section {
            margin-top: 100px;
        }

        section h2 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent);
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #blog-feed {
            display: grid;
            gap: 20px;
        }

        .post-card {
            background: var(--surface);
            padding: 24px;
            border-radius: 4px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: transform 0.2s ease, background 0.2s ease;
            border-left: 0 solid var(--accent);
        }

        .post-card:hover {
            transform: translateX(10px);
            background: #1e1e24;
            border-left-width: 4px;
        }

        .post-title {
            font-size: 1.25rem;
            font-weight: 500;
            line-height: 1.3;
        }

        .post-date {
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .loading {
            opacity: 0.5;
            font-style: italic;
        }

        .error-state {
            padding: 20px;
            border: 1px dashed #333;
            text-align: center;
        }

        footer {
            padding: 40px 24px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-dim);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @media (max-width: 600px) {
            main { padding: 40px 20px; }
            header { margin-bottom: 50px; }
            section { margin-top: 60px; }
        }
    </style>
</head>
<body>

<div id="mandatory-bot-banner" style="background-color: #0b0f19; color: #e2e8f0; text-align: center; padding: 12px 40px 12px 16px; font-size: 14px; font-family: system-ui, -apple-system, sans-serif; position: relative; width: 100%; box-sizing: border-box; z-index: 10000; border-bottom: 1px solid #1e293b; display: flex; justify-content: center; align-items: center; min-height: 48px; line-height: 1.5;">
    <span style="max-width: 800px; margin: 0 auto;">
        The design and code of this website are automatically generated and updated weekly by an LLM. 
        <a href="/prompt.txt" style="color: #38bdf8; text-decoration: none; font-weight: 500; white-space: nowrap; margin-left: 4px;">Read the prompt &rarr;</a>
    </span>
    <button onclick="document.getElementById('mandatory-bot-banner').remove()" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: #1e293b; border: 1px solid #334155; border-radius: 4px; color: #94a3b8; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;" onmouseover="this.style.color='#fff';this.style.backgroundColor='#334155';" onmouseout="this.style.color='#94a3b8';this.style.backgroundColor='#1e293b';">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
</div>


    <main>
        <header>
            <h1>Akshay<br>Thalinja</h1>
            <p class="role">Senior Software Engineer @ Akaike</p>
            
            <nav class="nav-links">
                <a href="https://github.com/akstspace" target="_blank" rel="noopener">GitHub</a>
                <a href="https://in.linkedin.com/in/akshay-t-b18b13172" target="_blank" rel="noopener">LinkedIn</a>
                <a href="https://chaioverflow.substack.com" target="_blank" rel="noopener">Blog</a>
            </nav>
        </header>

        <section id="writing">
            <h2>Recent Writing</h2>
            <div id="blog-feed">
                <p class="loading">Fetching latest logs...</p>
            </div>
        </section>
    </main>

    <footer>
        chaioverflow &copy; <span id="year"></span>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        async function fetchPosts() {
            const feedContainer = document.getElementById('blog-feed');
            const RSS_URL = 'https://api.rss2json.com/v1/api.json?rss_url=https://chaioverflow.substack.com/feed';

            try {
                const response = await fetch(RSS_URL);
                const data = await response.json();

                if (data.status === 'ok') {
                    feedContainer.innerHTML = '';
                    const posts = data.items.slice(0, 3);
                    
                    posts.forEach(post => {
                        const date = new Date(post.pubDate).toLocaleDateString('en-US', {
                            year: 'numeric',
                            month: 'long',
                            day: 'numeric'
                        });

                        const card = document.createElement('a');
                        card.href = post.link;
                        card.target = '_blank';
                        card.className = 'post-card';
                        card.innerHTML = `
                            <span class="post-date">${date}</span>
                            <span class="post-title">${post.title}</span>
                        `;
                        feedContainer.appendChild(card);
                    });
                } else {
                    throw new Error('Fallback required');
                }
            } catch (error) {
                feedContainer.innerHTML = `
                    <div class="error-state">
                        <p>Unable to load posts. Please visit the blog directly.</p>
                        <br>
                        <a href="https://chaioverflow.substack.com" target="_blank" style="color:var(--accent)">chaioverflow.substack.com</a>
                    </div>
                `;
            }
        }

        fetchPosts();
    </script>
</body>
</html>
