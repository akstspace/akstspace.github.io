<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akshay Thalinja | Senior Software Engineer</title>
    <meta name="description" content="Akshay Thalinja — Senior Software Engineer at Akaike Technologies.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Instrument+Serif&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --accent: #e0fbfc;
            --text-main: #ffffff;
            --text-dim: #888888;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Organic Background Shape */
        body::before {
            content: "";
            position: fixed;
            top: -10%;
            right: -10%;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(224, 251, 252, 0.05) 0%, rgba(10, 10, 10, 0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 4rem 2rem;
            flex: 1;
        }

        header {
            margin-bottom: 6rem;
        }

        h1 {
            font-family: 'Instrument Serif', serif;
            font-size: clamp(3.5rem, 10vw, 6rem);
            font-weight: 400;
            line-height: 0.9;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
        }

        .role {
            font-size: 1.1rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.2rem;
            font-weight: 500;
        }

        nav {
            margin-top: 3rem;
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }

        nav a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        nav a:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        .section-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--text-dim);
            letter-spacing: 0.3rem;
            margin-bottom: 2rem;
            display: block;
        }

        #blog-feed {
            display: grid;
            gap: 1.5rem;
        }

        .post-card {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 2rem;
            text-decoration: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.3s ease, background 0.3s ease;
        }

        .post-card:hover {
            transform: translateX(10px);
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--accent);
        }

        .post-content h3 {
            font-size: 1.4rem;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 0.5rem;
            font-family: 'Instrument Serif', serif;
        }

        .post-date {
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        .loading, .error {
            padding: 2rem;
            text-align: center;
            border: 1px dashed var(--border);
            color: var(--text-dim);
        }

        footer {
            padding: 4rem 2rem;
            border-top: 1px solid var(--border);
            text-align: center;
        }

        .brand {
            font-family: 'Instrument Serif', serif;
            font-style: italic;
            font-size: 1.5rem;
            color: var(--accent);
        }

        .year {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-top: 0.5rem;
        }

        @media (max-width: 600px) {
            .container { padding: 2rem 1.5rem; }
            header { margin-bottom: 3rem; }
            .post-card { flex-direction: column; align-items: flex-start; gap: 1rem; }
            nav { gap: 1rem; }
        }
    </style>
</head>
<body>

<div id="mandatory-bot-banner" style="background-color: #0b0f19; color: #e2e8f0; text-align: center; padding: 12px 40px 12px 16px; font-size: 14px; font-family: system-ui, -apple-system, sans-serif; position: relative; width: 100%; box-sizing: border-box; z-index: 10000; border-bottom: 1px solid #1e293b; display: flex; justify-content: center; align-items: center; min-height: 48px; line-height: 1.5;">
    <span style="max-width: 800px; margin: 0 auto;">
        The design and code of this website are automatically generated and updated weekly by an LLM. 
        <a href="/prompt.txt" style="color: #38bdf8; text-decoration: none; font-weight: 500; white-space: nowrap; margin-left: 4px;">Read the prompt &rarr;</a>
    </span>
    <button onclick="document.getElementById('mandatory-bot-banner').remove()" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: #1e293b; border: 1px solid #334155; border-radius: 4px; color: #94a3b8; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;" onmouseover="this.style.color='#fff';this.style.backgroundColor='#334155';" onmouseout="this.style.color='#94a3b8';this.style.backgroundColor='#1e293b';">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
</div>


    <main class="container">
        <header>
            <h1>Akshay Thalinja</h1>
            <p class="role">Senior Software Engineer @ Akaike</p>
            
            <nav>
                <a href="https://github.com/akstspace" target="_blank" rel="noopener">GitHub</a>
                <a href="https://in.linkedin.com/in/akshay-t-b18b13172" target="_blank" rel="noopener">LinkedIn</a>
                <a href="https://chaioverflow.substack.com" target="_blank" rel="noopener">Blog</a>
            </nav>
        </header>

        <section>
            <span class="section-label">Latest Writing</span>
            <div id="blog-feed">
                <div class="loading">Fetching posts from Substack...</div>
            </div>
        </section>
    </main>

    <footer>
        <div class="brand">chaioverflow</div>
        <div class="year">© <span id="current-year"></span></div>
    </footer>

    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();

        async function fetchPosts() {
            const feedContainer = document.getElementById('blog-feed');
            const rssUrl = 'https://chaioverflow.substack.com/feed';
            const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                
                if (data.status === 'ok') {
                    feedContainer.innerHTML = '';
                    const entries = data.items.slice(0, 3);
                    
                    entries.forEach(post => {
                        const date = new Date(post.pubDate).toLocaleDateString('en-US', {
                            month: 'short',
                            day: 'numeric',
                            year: 'numeric'
                        });

                        const article = document.createElement('a');
                        article.href = post.link;
                        article.target = '_blank';
                        article.className = 'post-card';
                        article.innerHTML = `
                            <div class="post-content">
                                <h3>${post.title}</h3>
                                <span class="post-date">${date}</span>
                            </div>
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent)"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
                        `;
                        feedContainer.appendChild(article);
                    });
                } else {
                    throw new Error('API returned error');
                }
            } catch (error) {
                feedContainer.innerHTML = `
                    <div class="error">
                        <p>Unable to load posts.</p>
                        <a href="https://chaioverflow.substack.com" target="_blank" style="color: var(--accent); font-size: 0.9rem;">View all posts on Substack →</a>
                    </div>
                `;
            }
        }

        fetchPosts();
    </script>
</body>
</html>
