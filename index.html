<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akshay Thalinja | Senior Software Engineer</title>
    <meta name="description" content="Akshay Thalinja, Senior Software Engineer at Akaike.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fafaf7;
            --text: #111111;
            --muted: #555555;
            --accent: #2a4a3a;
            --rule: #d8d4ca;
            --ease: 200ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'IBM Plex Sans', system-ui, sans-serif;
            font-weight: 400;
            line-height: 1.65;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .page {
            width: 100%;
            max-width: 38rem;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        header {
            padding: 18vh 0 12vh;
        }

        .name {
            font-family: 'Fraunces', Georgia, serif;
            font-size: clamp(2.5rem, 7vw, 4rem);
            font-weight: 500;
            line-height: 1.05;
            letter-spacing: -0.02em;
            font-variation-settings: "opsz" 144;
        }

        .role {
            margin-top: 1.25rem;
            font-size: 1.0625rem;
            color: var(--muted);
        }

        nav.links {
            margin-top: 2.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1.75rem;
            font-size: 0.9375rem;
        }

        nav.links a {
            color: var(--text);
            text-decoration: none;
            border-bottom: 1px solid var(--rule);
            padding-bottom: 0.125rem;
            transition: color var(--ease), border-color var(--ease);
        }

        nav.links a:hover,
        nav.links a:focus-visible {
            color: var(--accent);
            border-bottom-color: var(--accent);
            outline: none;
        }

        main {
            padding-bottom: 10vh;
        }

        h2 {
            font-family: 'Fraunces', Georgia, serif;
            font-size: 1.5rem;
            font-weight: 500;
            line-height: 1.3;
            letter-spacing: -0.01em;
            margin-bottom: 0.5rem;
        }

        .feed {
            list-style: none;
        }

        .feed li {
            border-top: 1px solid var(--rule);
        }

        .feed li:last-child {
            border-bottom: 1px solid var(--rule);
        }

        .post {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 1.5rem;
            padding: 1rem 0;
        }

        .post a {
            color: var(--text);
            text-decoration: none;
            transition: color var(--ease);
        }

        .post a:hover,
        .post a:focus-visible {
            color: var(--accent);
            outline: none;
        }

        .post-title {
            font-size: 1.0625rem;
            line-height: 1.4;
        }

        .post-date {
            font-size: 0.875rem;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .skeleton {
            display: block;
            background-color: #e6e3d9;
            border-radius: 2px;
            animation: skeleton-pulse 1.6s ease-in-out infinite;
        }

        .skeleton-title {
            height: 1.0625rem;
        }

        .skeleton-date {
            height: 0.875rem;
            width: 5.25rem;
            flex: 0 0 5.25rem;
        }

        .feed > li:nth-child(2) .skeleton {
            animation-delay: 0.15s;
        }

        .feed > li:nth-child(3) .skeleton {
            animation-delay: 0.3s;
        }

        @keyframes skeleton-pulse {
            0%, 100% { opacity: 0.55; }
            50%      { opacity: 1; }
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .status {
            padding: 1.25rem 0;
            color: var(--muted);
            font-size: 0.9375rem;
        }

        .status a {
            color: var(--text);
            text-decoration: underline;
            text-decoration-color: var(--rule);
            text-underline-offset: 3px;
            transition: color var(--ease), text-decoration-color var(--ease);
        }

        .status a:hover,
        .status a:focus-visible {
            color: var(--accent);
            text-decoration-color: var(--accent);
            outline: none;
        }

        footer {
            margin-top: auto;
            padding: 2.5rem 0 3rem;
            border-top: 1px solid var(--rule);
        }

        .footer-text {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 1rem;
            font-size: 0.875rem;
            color: var(--muted);
        }

        @media (max-width: 480px) {
            header {
                padding: 12vh 0 8vh;
            }
            .post {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.25rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition: none !important;
                animation: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <header>
            <h1 class="name">Akshay Thalinja</h1>
            <p class="role">Senior Software Engineer at Akaike</p>
            <nav class="links" aria-label="Profiles">
                <a href="https://github.com/akstspace" target="_blank" rel="noopener">GitHub</a>
                <a href="https://in.linkedin.com/in/akshay-t-b18b13172" target="_blank" rel="noopener">LinkedIn</a>
                <a href="https://chaioverflow.substack.com" target="_blank" rel="noopener">Blog</a>
            </nav>
        </header>

        <main>
            <h2>Writing</h2>
            <ul class="feed" id="blog-feed" aria-busy="true" aria-live="polite">
                <li aria-hidden="true">
                    <div class="post">
                        <span class="skeleton skeleton-title" style="width: 78%"></span>
                        <span class="skeleton skeleton-date"></span>
                    </div>
                </li>
                <li aria-hidden="true">
                    <div class="post">
                        <span class="skeleton skeleton-title" style="width: 62%"></span>
                        <span class="skeleton skeleton-date"></span>
                    </div>
                </li>
                <li aria-hidden="true">
                    <div class="post">
                        <span class="skeleton skeleton-title" style="width: 71%"></span>
                        <span class="skeleton skeleton-date"></span>
                    </div>
                </li>
            </ul>
            <p class="sr-only" id="feed-status">Loading latest posts</p>
        </main>

        <footer>
            <div class="footer-text">
                <span>chaioverflow</span>
                <span id="year"></span>
            </div>
        </footer>
    </div>

    <script>
        (function () {
            document.getElementById('year').textContent = new Date().getFullYear();

            const feed = document.getElementById('blog-feed');
            const rssUrl = 'https://api.rss2json.com/v1/api.json?rss_url=https://chaioverflow.substack.com/feed';

            const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[c]));

            async function loadFeed() {
                try {
                    const res = await fetch(rssUrl);
                    if (!res.ok) throw new Error('Network error');
                    const data = await res.json();
                    if (data.status !== 'ok' || !Array.isArray(data.items) || data.items.length === 0) {
                        throw new Error('Feed unavailable');
                    }

                    const posts = data.items.slice(0, 3).map((post) => {
                        const date = new Date(post.pubDate);
                        const dateLabel = isNaN(date.getTime())
                            ? ''
                            : date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
                        const dateAttr = isNaN(date.getTime()) ? '' : date.toISOString();
                        return `
                            <li>
                                <div class="post">
                                    <a href="${escapeHtml(post.link)}" target="_blank" rel="noopener">
                                        <span class="post-title">${escapeHtml(post.title)}</span>
                                    </a>
                                    <time class="post-date" datetime="${escapeHtml(dateAttr)}">${escapeHtml(dateLabel)}</time>
                                </div>
                            </li>`;
                    }).join('');

                    feed.innerHTML = posts;
                    feed.setAttribute('aria-busy', 'false');
                    const status = document.getElementById('feed-status');
                    if (status) status.remove();
                } catch (err) {
                    feed.innerHTML = `
                        <li><div class="status">
                            Couldn't load the feed.
                            <a href="https://chaioverflow.substack.com" target="_blank" rel="noopener">Read on Substack</a>.
                        </div></li>`;
                    feed.setAttribute('aria-busy', 'false');
                    const status = document.getElementById('feed-status');
                    if (status) status.textContent = "Couldn't load posts";
                }
            }

            loadFeed();
        })();
    </script>
</body>
</html>
