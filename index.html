<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akshay Thalinja | Senior Software Engineer</title>
    <meta name="description" content="Akshay Thalinja — Senior Software Engineer at Akaike Technologies.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Syne:wght@400;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --accent: #ff4d00;
            --text: #ffffff;
            --text-muted: #888888;
            --glass: rgba(255, 255, 255, 0.03);
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Abstract Background Elements */
        .bg-mesh {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(circle at 20% 20%, rgba(255, 77, 0, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(255, 77, 0, 0.05) 0%, transparent 40%);
            opacity: 0.6;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 2rem;
            width: 100%;
        }

        header {
            padding: 10vh 0 5vh;
        }

        .hero {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: clamp(3rem, 10vw, 6rem);
            font-weight: 800;
            line-height: 0.9;
            text-transform: uppercase;
            letter-spacing: -2px;
            background: linear-gradient(to bottom, #fff 40%, #444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .role {
            font-size: clamp(1rem, 3vw, 1.5rem);
            color: var(--text-muted);
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .links {
            display: flex;
            gap: 2rem;
            margin-top: 3rem;
            flex-wrap: wrap;
        }

        .links a {
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.8rem 1.5rem;
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 100px;
            transition: var(--transition);
        }

        .links a:hover {
            background: var(--accent);
            border-color: var(--accent);
            transform: translateY(-3px);
            color: #000;
        }

        section {
            margin: 8vh 0;
        }

        .section-label {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--accent);
            letter-spacing: 4px;
            margin-bottom: 2rem;
            font-weight: 700;
        }

        #blog-feed {
            display: grid;
            gap: 1.5rem;
        }

        .post-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem;
            background: var(--glass);
            border-left: 2px solid transparent;
            text-decoration: none;
            color: inherit;
            transition: var(--transition);
            border-radius: 4px;
        }

        .post-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-left: 2px solid var(--accent);
            transform: translateX(10px);
        }

        .post-title {
            font-size: clamp(1.1rem, 2vw, 1.4rem);
            font-weight: 500;
            max-width: 70%;
        }

        .post-date {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-family: monospace;
        }

        .loading, .error {
            padding: 3rem;
            text-align: center;
            background: var(--glass);
            color: var(--text-muted);
            border-radius: 4px;
        }

        .error a {
            color: var(--accent);
            text-decoration: none;
        }

        footer {
            margin-top: auto;
            padding: 4rem 0;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .post-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }
            .post-title {
                max-width: 100%;
            }
            .links {
                gap: 1rem;
            }
            .links a {
                padding: 0.6rem 1rem;
                flex: 1 1 40%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div id="mandatory-bot-banner" style="background-color: #0b0f19; color: #e2e8f0; text-align: center; padding: 12px 40px 12px 16px; font-size: 14px; font-family: system-ui, -apple-system, sans-serif; position: relative; width: 100%; box-sizing: border-box; z-index: 10000; border-bottom: 1px solid #1e293b; display: flex; justify-content: center; align-items: center; min-height: 48px; line-height: 1.5;">
    <span style="max-width: 800px; margin: 0 auto;">
        The design and code of this website are automatically generated and updated weekly by an LLM. 
        <a href="/prompt.txt" style="color: #38bdf8; text-decoration: none; font-weight: 500; white-space: nowrap; margin-left: 4px;">Read the prompt &rarr;</a>
    </span>
    <button onclick="document.getElementById('mandatory-bot-banner').remove()" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: #1e293b; border: 1px solid #334155; border-radius: 4px; color: #94a3b8; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;" onmouseover="this.style.color='#fff';this.style.backgroundColor='#334155';" onmouseout="this.style.color='#94a3b8';this.style.backgroundColor='#1e293b';">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
</div>

    <div class="bg-mesh"></div>

    <div class="container">
        <header>
            <div class="hero">
                <span class="role">Senior Software Engineer @ Akaike</span>
                <h1>Akshay<br>Thalinja</h1>
                <div class="links">
                    <a href="https://github.com/akstspace" target="_blank" rel="noopener">GitHub</a>
                    <a href="https://in.linkedin.com/in/akshay-t-b18b13172" target="_blank" rel="noopener">LinkedIn</a>
                    <a href="https://chaioverflow.substack.com" target="_blank" rel="noopener">Blog</a>
                </div>
            </div>
        </header>

        <section id="writing">
            <span class="section-label">Latest Writing</span>
            <div id="blog-feed">
                <div class="loading">Fetching latest transmission...</div>
            </div>
        </section>

        <footer>
            <div class="footer-content">
                <span>chaioverflow</span>
                <span id="year"></span>
            </div>
        </footer>
    </div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        async function fetchFeed() {
            const feedContainer = document.getElementById('blog-feed');
            const rssUrl = 'https://api.rss2json.com/v1/api.json?rss_url=https://chaioverflow.substack.com/feed';

            try {
                const response = await fetch(rssUrl);
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();

                if (data.status === 'ok') {
                    feedContainer.innerHTML = '';
                    data.items.slice(0, 3).forEach(post => {
                        const date = new Date(post.pubDate).toLocaleDateString('en-US', {
                            year: 'numeric',
                            month: 'short',
                            day: 'numeric'
                        });
                        
                        const card = document.createElement('a');
                        card.href = post.link;
                        card.target = '_blank';
                        card.className = 'post-card';
                        card.innerHTML = `
                            <span class="post-title">${post.title}</span>
                            <span class="post-date">${date}</span>
                        `;
                        feedContainer.appendChild(card);
                    });
                } else {
                    throw new Error('API status not ok');
                }
            } catch (error) {
                feedContainer.innerHTML = `
                    <div class="error">
                        Unable to load feed. 
                        <a href="https://chaioverflow.substack.com" target="_blank">Visit Blog Directly &rarr;</a>
                    </div>
                `;
            }
        }

        fetchFeed();
    </script>
</body>
</html>
